name: Main Workflow

on:
  push:
  pull_request:
  release:
    types:
      - created

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
#        Configuration: [Debug, Release, ReleaseTracyProfiler]
        Configuration: [Release, ReleaseTracyProfiler]
        Platform: [x64]
        include:
#          - Configuration: Debug
#            ConfigurationReal: Debug
          - Configuration: Release
            ConfigurationReal: Release
          - Configuration: ReleaseTracyProfiler
            ConfigurationReal: Release
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Restore pinned dependencies
      shell: powershell
      run: |
        .\Restore_Build_3.597_Dependencies.ps1

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: MSBuild
      shell: cmd
      run: |
        set "APPVEYOR_BUILD_VERSION=3.597"
        set "APPVEYOR_REPO_NAME=WoT&SP Fixes"
        set CONFIGURATION_GA=${{ matrix.Configuration }}
        
        msbuild Engine.sln /t:Rebuild /p:Configuration=${{ matrix.ConfigurationReal }} /p:Platform=${{ matrix.Platform }}
    - name: Stage OpenMP runtime
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $vsLocator = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vsInstall = & $vsLocator -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
        $runtime = Get-ChildItem -LiteralPath (Join-Path $vsInstall 'VC\Redist\MSVC') -Filter vcomp140.dll -Recurse |
          Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC[0-9]+\.OpenMP\\' -and $_.FullName -notmatch '\\onecore\\' } |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $runtime) { throw 'The x64 OpenMP runtime was not found.' }
        Copy-Item -LiteralPath $runtime.FullName -Destination 'bin_x64\vcomp140.dll' -Force
    - name: Prepare artifacts
      shell: cmd
      run: |
        set "APPVEYOR_BUILD_VERSION=3.597"
        set CONFIGURATION=${{ matrix.Configuration }}
        set PLATFORM=${{ matrix.Platform }}
        set OGSR_ARTIFACT_NAME=OGSR_Engine_WoT_SP_Fixes_BTR_%PLATFORM%_%APPVEYOR_BUILD_VERSION%_%CONFIGURATION%.7z
        cd bin_%PLATFORM%
        
        md ..\Game\Resources_CoP_1.6.02\bin_%PLATFORM%
        
        copy *.* ..\Game\Resources_CoP_1.6.02\bin_%PLATFORM%
        
        cd ..\Game\Resources_CoP_1.6.02
        
        7z a -t7z -m0=LZMA2:d=96m:fb=273 -mx=9 -mmt=2 ..\..\%OGSR_ARTIFACT_NAME% .\
    - name: Upload OGSR artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: OGSR_Engine_WoT_SP_Fixes_BTR_${{ matrix.Platform }}_3.597_${{ matrix.Configuration }}.7z
        path: .\OGSR_Engine_WoT_SP_Fixes_BTR_${{ matrix.Platform }}_3.597_${{ matrix.Configuration }}.7z

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: shogo82148/actions-upload-release-asset@v1.10.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: .\OGSR_Engine_WoT_SP_Fixes_BTR_${{ matrix.Platform }}_3.597_${{ matrix.Configuration }}.7z
        asset_name: OGSR_Engine_WoT_SP_Fixes_BTR_${{ matrix.Platform }}_3.597_${{ matrix.Configuration }}.7z
        asset_content_type: application/x-7z-compressed
